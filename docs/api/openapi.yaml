openapi: 3.1.0
info:
  title: InboxMosire Producer / Adapter API
  version: 0.1.0
  description: 'Local-only notification board API. MCP is the Agent tool plane; this HTTP API is

    for producers (push) and host adapters (status + SSE). The API binds to loopback only

    in v1. All bearer tokens go in the Authorization header; never put a token in a URL.

    '
servers:
- url: http://127.0.0.1:18765
  description: Local loopback API
security:
- bearerAuth: []
tags:
- name: Health
- name: Producer
- name: Adapter
- name: Admin
paths:
  /healthz:
    get:
      tags:
      - Health
      security: []
      operationId: healthz
      responses:
        '200':
          description: Process is alive.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    const: ok
                required:
                - status
  /readyz:
    get:
      tags:
      - Health
      security: []
      operationId: readyz
      responses:
        '200':
          description: Database is ready.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    const: ready
                required:
                - status
        '503':
          description: Database or default inbox not ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/inboxes/{inbox}/items:
    post:
      tags:
      - Producer
      operationId: pushItem
      summary: Push one notification into an inbox.
      description: Requires bearer scope `items:write`. Token must also be scoped to the inbox and channel.
      parameters:
      - $ref: '#/components/parameters/Inbox'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushItemRequest'
            examples:
              ticketReply:
                value:
                  channel: ticket
                  kind: reply
                  title: Ticket updated
                  payload:
                    id: ticket-42
                    body: User-visible content lives here, never in SSE or wake messages.
                  payloadRef: null
                  dedupeKey: ticket-42:reply:7
                  priority: 0
      responses:
        '201':
          description: Item created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushItemResponse'
        '200':
          description: Deduplicated existing active item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushItemResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          description: Body exceeds 1 MiB.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          $ref: '#/components/responses/Unprocessable'
    get:
      tags:
      - Producer
      operationId: listItems
      summary: List available item summaries without payload.
      description: Requires `items:read`. Channel-scoped credentials see only their channels.
      parameters:
      - $ref: '#/components/parameters/Inbox'
      - name: channel
        in: query
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      responses:
        '200':
          description: Available items.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /v1/inboxes/{inbox}/status:
    get:
      tags:
      - Adapter
      operationId: getStatus
      summary: Get the current board truth without item content.
      description: Requires bearer scope `status:read`. Channel-scoped tokens see only their allowed channels.
      parameters:
      - $ref: '#/components/parameters/Inbox'
      - name: channel
        in: query
        required: false
        description: Repeat for multiple channels; comma-separated values are also accepted by the server.
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: Current board snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboxStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/inboxes/{inbox}/events:
    get:
      tags:
      - Adapter
      operationId: streamEvents
      summary: Subscribe to board change events over SSE.
      description: 'Requires bearer scope `events:read`. The response is `text/event-stream`.

        Each event has an SSE `id:` equal to the durable event sequence and an

        `event: inbox.changed` name. The `data:` line is a CloudEvents 1.0 JSON envelope.

        Events contain counts and channel changes only: no title, payload, claim token,

        or API token.


        A client with no Last-Event-ID starts at the current event tip. Adapters should

        fetch `/status` on startup and use this stream as an invalidation signal.

        Reconnect with the last SSE id in the `Last-Event-ID` header to replay events.

        '
      parameters:
      - $ref: '#/components/parameters/Inbox'
      - name: Last-Event-ID
        in: header
        required: false
        schema:
          type: integer
          minimum: 0
          format: int64
      - name: Accept
        in: header
        required: false
        schema:
          type: string
          example: text/event-stream
      responses:
        '200':
          description: 'SSE stream. Heartbeats are comment frames (`: ping`).'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-cache
          content:
            text/event-stream:
              schema:
                type: string
              examples:
                changed:
                  summary: CloudEvents 1.0 frame
                  value: 'id: 12

                    event: inbox.changed

                    data: {"specversion":"1.0","id":"evt_...","source":"urn:inboxmosire:inbox:main","type":"io.mosire.inbox.changed.v1","subject":"main","time":"2026-10-25T00:00:00Z","datacontenttype":"application/json","data":{"inbox":"main","revision":3,"available":1,"claimed":0,"channels":{"ticket":{"available":1,"claimed":0}},"changedChannels":["ticket"]}}

                    '
        '400':
          description: Invalid Last-Event-ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          description: Accept header does not allow text/event-stream.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/inboxes/{inbox}:
    put:
      tags:
      - Producer
      operationId: ensureInbox
      summary: Idempotently create the exact-bound inbox.
      description: Requires scope `inbox:ensure` on a token exactly bound to this inbox, or `admin:inboxes`. Wildcard producer
        tokens may not create arbitrary inboxes.
      parameters:
      - $ref: '#/components/parameters/Inbox'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnsureInboxResponse'
        '200':
          description: Already existed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnsureInboxResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /v1/inboxes/{inbox}/claims:
    post:
      tags:
      - Producer
      operationId: claimItems
      summary: Atomically claim selected item ids.
      description: Requires `items:manage`. The claim token in the response is the capability for complete/renew/release.
      parameters:
      - $ref: '#/components/parameters/Inbox'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimRequest'
      responses:
        '200':
          description: Claim result, including per-item accepted/rejected lists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /v1/inboxes/{inbox}/claims/renew:
    post:
      tags:
      - Producer
      operationId: renewClaims
      summary: Renew active claim leases.
      description: Requires `items:manage`.
      parameters:
      - $ref: '#/components/parameters/Inbox'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenewRequest'
      responses:
        '200':
          description: Operation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RenewResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /v1/inboxes/{inbox}/claims/complete:
    post:
      tags:
      - Producer
      operationId: completeClaims
      summary: Complete or fail claimed items.
      description: Requires `items:manage`.
      parameters:
      - $ref: '#/components/parameters/Inbox'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteRequest'
      responses:
        '200':
          description: Operation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompleteResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /v1/inboxes/{inbox}/claims/release:
    post:
      tags:
      - Producer
      operationId: releaseClaims
      summary: Release active claims back to available.
      description: Requires `items:manage`.
      parameters:
      - $ref: '#/components/parameters/Inbox'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReleaseRequest'
      responses:
        '200':
          description: Operation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /v1/admin/whoami:
    get:
      tags:
      - Admin
      operationId: whoAmI
      summary: Return metadata of the calling credential.
      description: Available to any valid bearer token. Never returns raw token.
      responses:
        '200':
          description: Credential metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialView'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/admin/credentials:
    get:
      tags:
      - Admin
      operationId: listCredentials
      summary: List credential metadata; raw token is never returned.
      description: Requires `admin:credentials`.
      parameters:
      - name: inbox
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Credential metadata list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/admin/inboxes/{inbox}/credentials:
    post:
      tags:
      - Admin
      operationId: issueCredential
      summary: Issue a scoped credential. Raw token is returned exactly once.
      description: Requires `admin:credentials`, or `credentials:issue:self` with an exact inbox binding and no scope/channel
        broadening.
      parameters:
      - $ref: '#/components/parameters/Inbox'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialIssueRequest'
      responses:
        '201':
          description: Issued credential and raw token. Store it in a local secret immediately.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedCredentialResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /v1/admin/credentials/{credentialId}/rotate:
    post:
      tags:
      - Admin
      operationId: rotateCredential
      summary: Revoke old credential and issue a replacement with the same scope.
      description: Requires `admin:credentials` or self-management authority over the target.
      parameters:
      - $ref: '#/components/parameters/CredentialId'
      responses:
        '200':
          description: Replacement credential and raw token returned once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedCredentialResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/admin/credentials/{credentialId}/revoke:
    post:
      tags:
      - Admin
      operationId: revokeCredential
      summary: Revoke a credential.
      parameters:
      - $ref: '#/components/parameters/CredentialId'
      responses:
        '200':
          description: Revocation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevokeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/inboxes/{inbox}/occupancy:
    get:
      tags:
      - Adapter
      operationId: getOccupancy
      summary: Read the advisory inbox occupancy marker.
      description: Requires `status:read`. Occupancy is advisory and is not an access lock; token scopes remain the access
        boundary.
      parameters:
      - $ref: '#/components/parameters/Inbox'
      responses:
        '200':
          description: Occupancy marker.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboxOccupancy'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
      - Adapter
      operationId: occupyInbox
      summary: Mark an inbox occupied. Idempotent; does not block other token holders.
      description: Requires `inbox:occupy`. The first occupant is retained until DELETE. This is informational only.
      parameters:
      - $ref: '#/components/parameters/Inbox'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OccupyInboxRequest'
      responses:
        '200':
          description: Current occupancy marker.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboxOccupancy'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
    delete:
      tags:
      - Adapter
      operationId: vacateInbox
      summary: Clear the advisory inbox occupancy marker.
      description: Requires `inbox:occupy`.
      parameters:
      - $ref: '#/components/parameters/Inbox'
      responses:
        '200':
          description: Cleared occupancy marker.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboxOccupancy'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: 'Locally issued opaque token. Scopes: items:write, items:read, items:manage, status:read, events:read,
        inbox:ensure, inbox:occupy, credentials:issue:self, admin:inboxes, admin:credentials. Occupancy is advisory; scopes
        are the access boundary.'
  parameters:
    Inbox:
      name: inbox
      in: path
      required: true
      schema:
        type: string
        pattern: ^[A-Za-z0-9._-]{1,64}$
    CredentialId:
      name: credentialId
      in: path
      required: true
      schema:
        type: string
  responses:
    BadRequest:
      description: Malformed request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: Missing or invalid bearer token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: Token is valid but lacks scope/inbox/channel permission.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Inbox or route not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unprocessable:
      description: Domain validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    PushItemRequest:
      type: object
      additionalProperties: false
      required:
      - channel
      properties:
        channel:
          type: string
          pattern: ^[A-Za-z0-9._-]{1,64}$
        kind:
          type: string
          pattern: ^[A-Za-z0-9._-]{1,64}$
          default: notification
        title:
          type:
          - string
          - 'null'
          maxLength: 512
          description: Optional human label. Present in inbox_list, but never in SSE or wake messages.
        payload:
          description: Opaque item content. Returned only to the Agent after MCP claim.
        payloadRef:
          type:
          - string
          - 'null'
          maxLength: 2048
        dedupeKey:
          type:
          - string
          - 'null'
          maxLength: 256
          description: Deduplicates non-done items in the same inbox+channel.
        priority:
          type: integer
          minimum: -1000
          maximum: 1000
          default: 0
    PushItemResponse:
      type: object
      required:
      - itemId
      - duplicate
      - revision
      - createdAt
      properties:
        itemId:
          type: string
        duplicate:
          type: boolean
        revision:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
    ChannelCounts:
      type: object
      required:
      - available
      - claimed
      properties:
        available:
          type: integer
          format: int64
        claimed:
          type: integer
          format: int64
    InboxStatus:
      type: object
      required:
      - inbox
      - revision
      - available
      - claimed
      - channels
      - updatedAt
      properties:
        inbox:
          type: string
        revision:
          type: integer
          format: int64
        available:
          type: integer
          format: int64
        claimed:
          type: integer
          format: int64
        channels:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ChannelCounts'
        updatedAt:
          type: string
          format: date-time
        occupied:
          type: boolean
        occupiedBy:
          type:
          - string
          - 'null'
        occupiedAt:
          type:
          - string
          - 'null'
          format: date-time
    ErrorEnvelope:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
              enum:
              - INVALID_ARGUMENT
              - INVALID_JSON
              - INVALID_CURSOR
              - UNAUTHORIZED
              - FORBIDDEN
              - NOT_FOUND
              - METHOD_NOT_ALLOWED
              - NOT_ACCEPTABLE
              - PAYLOAD_TOO_LARGE
              - UNSUPPORTED_MEDIA_TYPE
              - INTERNAL
            message:
              type: string
    CloudEventInboxChanged:
      type: object
      required:
      - specversion
      - id
      - source
      - type
      - subject
      - time
      - datacontenttype
      - data
      properties:
        specversion:
          type: string
          const: '1.0'
        id:
          type: string
        source:
          type: string
          example: urn:inboxmosire:inbox:main
        type:
          type: string
          const: io.mosire.inbox.changed.v1
        subject:
          type: string
        time:
          type: string
          format: date-time
        datacontenttype:
          type: string
          const: application/json
        data:
          type: object
          required:
          - inbox
          - revision
          - available
          - claimed
          - channels
          - changedChannels
          properties:
            inbox:
              type: string
            revision:
              type: integer
              format: int64
            available:
              type: integer
              format: int64
            claimed:
              type: integer
              format: int64
            channels:
              type: object
              additionalProperties:
                $ref: '#/components/schemas/ChannelCounts'
            changedChannels:
              type: array
              items:
                type: string
    EnsureInboxResponse:
      type: object
      required:
      - inbox
      - created
      properties:
        inbox:
          type: string
        created:
          type: boolean
    ItemSummary:
      type: object
      required:
      - itemId
      - channel
      - kind
      - priority
      - attempts
      - createdAt
      properties:
        itemId:
          type: string
        channel:
          type: string
        kind:
          type: string
        title:
          type:
          - string
          - 'null'
        priority:
          type: integer
        attempts:
          type: integer
        createdAt:
          type: string
          format: date-time
    ItemListResponse:
      type: object
      required:
      - inbox
      - items
      - count
      properties:
        inbox:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/ItemSummary'
        count:
          type: integer
    ClaimRequest:
      type: object
      required:
      - itemIds
      properties:
        itemIds:
          type: array
          items:
            type: string
        leaseSeconds:
          type: integer
          minimum: 30
          maximum: 3600
          default: 300
    ClaimedItem:
      type: object
      properties:
        itemId:
          type: string
        channel:
          type: string
        kind:
          type: string
        title:
          type:
          - string
          - 'null'
        payload: {}
        payloadRef:
          type:
          - string
          - 'null'
        priority:
          type: integer
        claimToken:
          type: string
        claimExpiresAt:
          type: string
          format: date-time
    Rejection:
      type: object
      properties:
        subject:
          type: string
        code:
          type: string
        message:
          type: string
    ClaimResult:
      type: object
      required:
      - revision
      - available
      - claimed
      - rejected
      properties:
        revision:
          type: integer
          format: int64
        available:
          type: integer
          format: int64
        claimed:
          type: array
          items:
            $ref: '#/components/schemas/ClaimedItem'
        rejected:
          type: array
          items:
            $ref: '#/components/schemas/Rejection'
    RenewRequest:
      type: object
      required:
      - claimTokens
      properties:
        claimTokens:
          type: array
          items:
            type: string
        leaseSeconds:
          type: integer
          minimum: 30
          maximum: 3600
          default: 300
    RenewedClaim:
